[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-scraper"
version = "0.1.0"
description = "Modular, anti-detection stealth scraping harness with persistent sessions, CDP support, and deduplicated SQLite storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Omni-Scraper Team" }
]
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
omni-scraper = "omni_scraper.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
